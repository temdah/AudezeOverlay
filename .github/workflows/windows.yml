name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    uses: ./.github/workflows/linux.yml

  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check release publishing
        run: ./tools/test-publish-release.ps1
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust update failed' }
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
      - name: Check formatting and tests
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting check failed' }
          cargo clippy --locked --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --locked --all-features --all-targets --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build and check rendering without a headset
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin audeze-overlay --bin preview-layouts
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          & 'target/x86_64-pc-windows-msvc/release/preview-layouts.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Layout check failed' }
      - name: Package portable app and installer
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $match = Select-String -LiteralPath Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -ne "v$version") { throw 'Release tag must match the version in Cargo.toml' }
          }
          ./tools/package.ps1 -BinaryPath 'target/x86_64-pc-windows-msvc/release/audeze-overlay.exe'
      - name: Upload Windows downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: |
            dist/release/Audeze-Overlay-Setup.exe
            dist/release/Audeze-Overlay-Portable.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload layout previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: layout-previews
          path: diagnostics/layout-*.png
          if-no-files-found: ignore

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, linux]
    runs-on: windows-2022
    timeout-minutes: 10
    concurrency:
      group: release-publishing
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: release-artifacts/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Audeze-Overlay-Linux-x86_64
          path: release-artifacts/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Audeze-Overlay-flatpak-x86_64
          path: release-artifacts/flatpak
      - name: Assemble verified downloads from this run
        shell: pwsh
        run: ./tools/prepare-release-downloads.ps1
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ./tools/publish-release.ps1 -Repository $env:GH_REPO -CommitSha $env:COMMIT_SHA -RefType $env:REF_TYPE -RefName $env:REF_NAME
