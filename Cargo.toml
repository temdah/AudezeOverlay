[package]
name = "audeze-overlay"
version = "1.0.5"
edition = "2021"
description = "A small native sound-status overlay for Audeze Maxwell headsets (Windows, and Linux on Wayland)"
license = "MIT"

[features]
legacy-uia = []
perf-stats = []
# Extra checks and a state transcript for `--smoke-test --smoke-golden`, used to
# compare behavior before and after a refactor. Adds about 52 KB, so it is not
# part of release builds.
golden-checks = []

[[bin]]
name = "bench-worker"
path = "src/bin/bench-worker/main.rs"
required-features = ["perf-stats"]

[[bin]]
name = "verify-controls"
path = "src/bin/verify-controls/main.rs"
required-features = ["legacy-uia"]

[[bin]]
name = "watch-audeze"
path = "src/bin/watch-audeze/main.rs"
required-features = ["legacy-uia"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12.0"
fontdue = "0.9.4"
svgtypes = "0.16.1"

# The Win32 API and the HID library are only meaningful on Windows. Other
# targets build the portable core without them.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_Bluetooth", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Security", "Win32_System_IO"] }
windows-core = "0.62"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

# Linux talks to the kernel's hidraw, poll and netlink interfaces directly.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser", "global_shortcuts", "background"] }
async-io = "2"
futures-lite = "2"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
rustix = { version = "1.1", features = ["event", "fs", "net"] }
smithay-client-toolkit = "0.21"

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
# Rasterization runs on the CPU. Favor vectorized drawing over the smallest EXE.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Linux only: the D-Bus and Wayland client crates are cold code (a handful of calls
# at startup and on user actions), so optimize them for size. Drawing, fonts and
# the application stay at opt-level 3. These crates are not in Windows builds.
[profile.release.package.zbus]
opt-level = "z"
[profile.release.package.zvariant]
opt-level = "z"
[profile.release.package.zvariant_utils]
opt-level = "z"
[profile.release.package.zbus_names]
opt-level = "z"
[profile.release.package.ksni]
opt-level = "z"
[profile.release.package.ashpd]
opt-level = "z"
[profile.release.package.async-io]
opt-level = "z"
[profile.release.package.async-process]
opt-level = "z"
[profile.release.package.async-executor]
opt-level = "z"
[profile.release.package.async-task]
opt-level = "z"
[profile.release.package.async-lock]
opt-level = "z"
[profile.release.package.async-channel]
opt-level = "z"
[profile.release.package.async-broadcast]
opt-level = "z"
[profile.release.package.blocking]
opt-level = "z"
[profile.release.package.event-listener]
opt-level = "z"
[profile.release.package.futures-lite]
opt-level = "z"
[profile.release.package.futures-util]
opt-level = "z"
[profile.release.package.wayland-client]
opt-level = "z"
[profile.release.package.wayland-backend]
opt-level = "z"
[profile.release.package.wayland-protocols]
opt-level = "z"
[profile.release.package.wayland-protocols-wlr]
opt-level = "z"
[profile.release.package.wayland-protocols-misc]
opt-level = "z"
[profile.release.package.wayland-protocols-experimental]
opt-level = "z"
[profile.release.package.smithay-client-toolkit]
opt-level = "z"
[profile.release.package.calloop]
opt-level = "z"
[profile.release.package.polling]
opt-level = "z"
[profile.release.package.xkbcommon]
opt-level = "z"
[profile.release.package.memmap2]
opt-level = "z"
